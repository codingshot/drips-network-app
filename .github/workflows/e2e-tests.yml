name: Run e2e tests
on:
  workflow_dispatch:
  pull_request:

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: e2e-tests.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
    
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Run E2E tests
        run: npm run e2e
